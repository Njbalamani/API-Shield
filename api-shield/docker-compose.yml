services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apishield
      POSTGRES_USER: apishield
      POSTGRES_PASSWORD: apishield
    volumes:
      - apishield-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apishield -d apishield"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py seed_rules &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - apishield-media:/app/media
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://apishield:apishield@db:5432/apishield

volumes:
  apishield-db:
  apishield-media:
